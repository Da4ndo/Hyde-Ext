[package]
name = "hyde-ext"
description = "Hyde-Ext is a Rust-based command-line application designed to enhance the HyDE (HyDE_CLI) environment. It automates tasks, installs essential tools, manages configurations, and restores settings from backups."
version = "1.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = "4.5.4"
colored = "2.1.0"
inquire = "0.7.5"
lazy_static = "1.4.0"
regex = "1.10.6"
reqwest = { version = "0.12.4", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10"
toml = "0.8.12"
walkdir = "2.3"
prettytable-rs = "0.10.0"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = 'abort'
incremental = false
