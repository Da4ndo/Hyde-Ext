name: DEPLOY

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  hyde-ext:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Rust stable version
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Prepare Environment Variables
        run: |
          echo "REPO_NAME=${{ github.repository }}" >> $GITHUB_ENV
          echo "SAFE_REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)" >> $GITHUB_ENV

      - name: Echo Variables
        run: |
          echo "Repository Name: $REPO_NAME"
          echo "Safe Repository Name: $SAFE_REPO_NAME"

      - name: Build Release
        run: |
          echo ":: Starting build process..."
          cargo build --release
          echo "  -> Build completed successfully."

      - name: Archive Release Binary
        run: |
          echo ":: Archiving release binary..."
          tar -czvf $SAFE_REPO_NAME-${{ github.ref_name }}-x86_64.tar.gz -C ./ assets -C ./target/release/ hyde-ext
          echo "  -> Archive created successfully."
          echo ":: Listing contents of the directory..."
          ls -alh
          echo "  -> Directory contents listed successfully."

      - name: Upload Release Tarball
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ env.SAFE_REPO_NAME }}-${{ github.ref_name }}-x86_64.tar.gz
          asset_name: ${{ env.SAFE_REPO_NAME }}-${{ github.ref_name }}-x86_64.tar.gz
          asset_content_type: application/gzip

      - name: Build and publish hyde-ext
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: hyde-ext
          pkgbuild: ./aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update hyde-ext AUR package
          ssh_keyscan_types: rsa,dsa,ecdsa,ed25519

  hyde-ext-git:
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build and publish hyde-ext-git
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: hyde-ext-git
          pkgbuild: ./aur-git/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update hyde-ext-git AUR package
          ssh_keyscan_types: rsa,dsa,ecdsa,ed25519
